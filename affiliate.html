<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portal de afiliados · Ascent</title>
<link rel="icon" href="/assets/img/logo-mark.png">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body>

<!-- Sign-in. Static and public; everything it can show comes from /api/affiliate,
     which only ever answers with the signed-in affiliate's own data. -->
<main id="login" class="login" hidden>
  <form id="login-form" class="card login-card" autocomplete="on">
    <h1>Portal de afiliados</h1>
    <p class="muted">Entra para ver quiénes usaron tu código y cómo va tu comisión.</p>
    <label for="email">Correo</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>
    <label for="pw">Contraseña</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <p class="msg err" id="login-msg" role="alert" hidden></p>
    <button class="btn primary" type="submit">Entrar</button>
  </form>
</main>

<!-- First sign-in (or after a reset): the temporary password must be replaced
     before any data is shown. -->
<main id="change" class="login" hidden>
  <form id="change-form" class="card login-card" autocomplete="off">
    <h1>Crea tu contraseña</h1>
    <p class="muted">Por seguridad, cambia la contraseña temporal por una propia (mínimo 10 caracteres).</p>
    <label for="cur">Contraseña temporal</label>
    <input id="cur" type="password" autocomplete="current-password" required>
    <label for="new1">Nueva contraseña</label>
    <input id="new1" type="password" autocomplete="new-password" minlength="10" required>
    <label for="new2">Repite la nueva contraseña</label>
    <input id="new2" type="password" autocomplete="new-password" minlength="10" required>
    <p class="msg err" id="change-msg" role="alert" hidden></p>
    <button class="btn primary" type="submit">Guardar y entrar</button>
  </form>
</main>

<div id="app" hidden>
  <header class="top">
    <strong class="brand">Ascent · Portal de afiliados</strong>
    <span class="grow" id="who" style="flex:1;color:rgba(255,255,255,.75)"></span>
    <button class="btn ghost" id="logout">Salir</button>
  </header>
  <main id="view" class="view" tabindex="-1"></main>
</div>

<script src="/assets/affiliate.js"></script>
</body>
</html>
